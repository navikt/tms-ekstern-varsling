name: Deploy branch

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: 'Det clusteret branchen skal deployes til'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: navikt/tms-backend-deploy/.github/workflows/reusable-build-and-deploy.yml@main
    with:
      clusters: ${{ format('[{0}]', toJSON(inputs.cluster)) }}
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
