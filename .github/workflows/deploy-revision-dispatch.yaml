name: Deploy revision

on:
  repository_dispatch:
    types: deploy-revision

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: navikt/tms-backend-deploy/.github/workflows/reusable-deploy-revision.yml@main
    with:
      commit: ${{ github.event.client_payload.commit }}
      clusters: ${{ toJSON(github.event.client_payload.clusters) }}
    secrets:
      NAIS_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
